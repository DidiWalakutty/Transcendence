name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://transcendence:transcendence@localhost:5432/transcendence
      DEV_FIXTURES: 'true'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: transcendence
          POSTGRES_USER: transcendence
          POSTGRES_PASSWORD: transcendence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U transcendence -d transcendence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22'
          cache: true

      - run: vp install --frozen-lockfile
      - run: vp run -w repo:check
      - run: vp run -w repo:test
      - run: vp run -w repo:build
