services:
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: ft_transcendence_frontend
    restart: unless-stopped
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      SERVER_URL: http://backend:3001
    depends_on:
      backend:
        condition: service_started

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: ft_transcendence_backend
    restart: unless-stopped
    environment:
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER:-transcendence}:${POSTGRES_PASSWORD:-transcendence}@postgres:5432/${POSTGRES_DB:-transcendence}
      REDIS_URL: redis://redis:6379
      THROTTLE_ENABLED: ${THROTTLE_ENABLED:-true}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-insecure-secret-change-in-production}
      BETTER_AUTH_URL: ${PUBLIC_ORIGIN:-https://localhost:3000}
      CORS_ORIGINS: ${PUBLIC_ORIGIN:-https://localhost:3000}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Transcendence123!}
      SEED_DIDI_PASSWORD: ${SEED_DIDI_PASSWORD:-Qwerty123!}
      SEED_HOMER_PASSWORD: ${SEED_HOMER_PASSWORD:-Simpsons123!}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: ft_transcendence_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-transcendence}
      POSTGRES_USER: ${POSTGRES_USER:-transcendence}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transcendence}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: ft_transcendence_redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6380}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    container_name: ft_transcendence_caddy
    restart: unless-stopped
    environment:
      HTTP_PORT: ${HTTP_PORT:-3080}
      HTTPS_PORT: ${HTTPS_PORT:-3000}
    ports:
      - '${HTTPS_PORT:-3000}:${HTTPS_PORT:-3000}'
      - '${HTTP_PORT:-3080}:${HTTP_PORT:-3080}'
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./caddy/certs:/certs
    depends_on:
      - frontend
      - backend

  mailpit:
    image: axllent/mailpit:latest
    container_name: ft_transcendence_mailpit
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'
volumes:
  postgres_data:
  redis_data:
